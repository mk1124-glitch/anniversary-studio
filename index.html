<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><title>Our Six Moments</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Nanum+Pen+Script&display=swap" rel="stylesheet"><style>
:root{--ink:#342c28;--accent:#876a59;--bg:#f7f4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e5ded6;background:#faf8f5}header b{font:16px Georgia,serif;letter-spacing:.15em}.small{font-size:12px;color:#897b70}main{max-width:850px;margin:auto;padding:18px 14px 35px}h1{font:normal 30px Georgia,serif;margin:8px 0}.sub{font-size:13px;color:#8b7b70;margin:0 0 20px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:0;padding:0;overflow:hidden;border-radius:12px;position:relative;background:#e7ddd2;aspect-ratio:2/3}.tile img{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;bottom:0;left:0;right:0;padding:25px 5px 9px;background:linear-gradient(transparent,#0009);color:white;font-size:12px}.hidden{display:none!important}.workspace{height:calc(100dvh - 55px);display:flex;flex-direction:column;overflow:hidden}.edit-head{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.ghost{border:0;background:none;color:var(--ink);padding:8px}.save{border:0;border-radius:10px;background:var(--accent);color:white;padding:10px 15px;font-weight:650}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px 8px}.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 5px 18px #0002;touch-action:none}.tabs{display:flex;border-top:1px solid #e5ded6;background:white}.tabs button{flex:1;border:0;background:white;padding:12px;color:#7d7169}.tabs button.active{color:#6d4938;font-weight:750;border-bottom:3px solid var(--accent)}.sheet{height:230px;overflow-y:auto;background:white;padding:13px 16px calc(16px + env(safe-area-inset-bottom))}.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px}.chips button{border:1px solid #e4ddd6;background:#faf8f5;border-radius:20px;padding:9px 14px;white-space:nowrap;font-size:13px}.chips button.active{background:#6e5547;color:white}.ctl{display:flex;align-items:center;gap:12px;margin:13px 0}.ctl label{width:75px;font-size:13px}.ctl input{flex:1;min-width:0;accent-color:#876a59}.ctl output{font-size:12px;width:30px;text-align:right}textarea{width:100%;border:1px solid #e0d7ce;border-radius:10px;padding:10px;resize:vertical;min-height:65px}.hint{font-size:12px;color:#877a70;line-height:1.5}.nav{display:flex;gap:10px;align-items:center}.nav button{background:white;border:1px solid #ddd1c8;border-radius:9px;padding:7px 11px}.colorchips{display:flex;gap:12px;margin:12px 0}.colorchips button{width:34px;height:34px;border-radius:50%;border:2px solid #ccc}.colorchips button.active{outline:2px solid #806454;outline-offset:3px}.result{position:fixed;inset:55px 0 0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}.result img{min-height:0;max-height:65dvh;max-width:100%;object-fit:contain}.result button{padding:12px 18px;border:0;border-radius:10px;background:#876a59;color:white}.result p{font-size:13px;color:#766c65;text-align:center;line-height:1.6}@media(max-width:480px){.gallery{grid-template-columns:repeat(2,1fr)}.sheet{height:240px}}
</style></head><body><header><b>OUR SIX MOMENTS</b><span class="small">2026 · Anniversary</span></header><main id="home"><div class="small">OUR PRIVATE STUDIO</div><h1>Six little moments.</h1><p class="sub">사진을 누르면 바로 필터와 클래식 자막을 편집할 수 있어요.</p><div class="gallery" id="gallery"></div></main><section id="editor" class="workspace hidden"><div class="edit-head"><button class="ghost" id="back">‹ 사진 목록</button><div class="nav"><button id="prev">‹</button><span class="small" id="counter">1 / 6</span><button id="next">›</button></div><button class="save" id="export">완성본 저장</button></div><div class="stage"><canvas id="preview"></canvas></div><div class="tabs"><button class="active" data-tab="filter">필터</button><button data-tab="adjust">세부 보정</button><button data-tab="caption">클래식 자막</button></div><div class="sheet"><div id="filter"><div class="chips" id="presets"></div><p class="hint">원본의 얼굴·체형·구도는 변경하지 않고 색감만 조절합니다.</p></div><div id="adjust" class="hidden"></div><div id="caption" class="hidden"><textarea id="captionText" spellcheck="false">2026.11.11&#10;3rd wedding&#10;anniversary</textarea><div class="ctl"><label>글씨 크기</label><input type="range" id="size" min="2" max="11" step=".2" value="5"><output id="sizeOut"></output></div><div class="ctl"><label>글자 간격</label><input type="range" id="spacing" min=".7" max="1.7" step=".05" value="1.1"><output id="spacingOut"></output></div><div class="colorchips" id="colors"></div><label class="hint"><input type="checkbox" id="captionOn" checked> 자막 표시</label><p class="hint">사진에서 자막을 손가락으로 끌어 위치를 변경할 수 있어요. 기본 위치는 오른쪽 상단입니다.</p></div></div></section><div id="result" class="result hidden"><img id="resultImage" alt="완성된 사진"><button id="share">아이폰 공유 / 사진 저장</button><button id="download">파일 다운로드</button><button id="closeResult">편집으로 돌아가기</button><p>아이폰에서는 공유 메뉴의 ‘이미지 저장’을 누르면 사진 앱에 저장할 수 있어요.</p></div><script>
const files=['IMG_6365.JPG','IMG_6366.JPG','IMG_6367.JPG','IMG_6368.JPG','IMG_6369.JPG','IMG_6370.JPG'];
const $=id=>document.getElementById(id),presets={원본:{},'2주년 무드':{warm:9,contrast:-10,saturation:-9,fade:11},'따뜻한 필름':{warm:18,contrast:-5,saturation:-9,fade:12},'소프트 크림':{warm:8,brightness:7,contrast:-13,saturation:-8},'빈티지':{warm:13,contrast:-12,saturation:-23,fade:22},'맑은 자연광':{brightness:6,contrast:5,saturation:5},'흑백':{saturation:-100,contrast:12}};
const defaults=()=>({preset:'원본',brightness:0,contrast:0,saturation:0,warm:0,fade:0,caption:'2026.11.11\n3rd wedding\nanniversary',size:5,spacing:1.1,x:.78,y:.14,color:'#74645d',captionOn:true});
let edits={};try{edits=JSON.parse(localStorage.getItem('six-moments-v1')||'{}')}catch{};let index=0,img=null,renderTimer=0,outputFile=null,outputURL=null;
const state=()=>edits[files[index]]||(edits[files[index]]=defaults());const persist=()=>localStorage.setItem('six-moments-v1',JSON.stringify(edits));
files.forEach((name,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=`<img loading="lazy" src="photos/${name}" alt="사진 ${i+1}"><span>${i+1} / 6</span>`;b.onclick=()=>open(i);$('gallery').append(b)});
function open(i){index=(i+6)%6;img=new Image();img.onload=()=>{sync();render()};img.src='photos/'+files[index];$('home').classList.add('hidden');$('editor').classList.remove('hidden');$('counter').textContent=(index+1)+' / 6'}
$('back').onclick=()=>{$('editor').classList.add('hidden');$('home').classList.remove('hidden')};$('prev').onclick=()=>open(index-1);$('next').onclick=()=>open(index+1);
const adj=[['brightness','밝기',-60,60],['contrast','대비',-60,60],['saturation','채도',-100,80],['warm','온도',-60,60],['fade','페이드',0,60]];
for(const [key,label,min,max] of adj){let d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${label}</label><input type="range" min="${min}" max="${max}" step="1" data-adj="${key}"><output></output>`;$('adjust').append(d);d.querySelector('input').oninput=e=>{state()[key]=+e.target.value;state().preset='직접 보정';persist();syncPresets();d.querySelector('output').textContent=e.target.value;render()}}
for(const [name,values] of Object.entries(presets)){let b=document.createElement('button');b.textContent=name;b.onclick=()=>{Object.assign(state(),{brightness:0,contrast:0,saturation:0,warm:0,fade:0},values,{preset:name});persist();sync();render()};$('presets').append(b)}
function syncPresets(){[...$('presets').children].forEach(b=>b.classList.toggle('active',b.textContent===state().preset))}
for(const [name,color] of [['브라운 그레이','#74645d'],['아이보리','#f2e8d7'],['화이트','#ffffff'],['다크 브라운','#4b3930']]){let b=document.createElement('button');b.style.background=color;b.title=name;b.onclick=()=>{state().color=color;persist();sync();render()};$('colors').append(b)}
function sync(){let s=state();syncPresets();document.querySelectorAll('[data-adj]').forEach(el=>{el.value=s[el.dataset.adj];el.nextElementSibling.textContent=el.value});$('captionText').value=s.caption;$('size').value=s.size;$('spacing').value=s.spacing;$('captionOn').checked=s.captionOn;$('sizeOut').textContent=s.size;$('spacingOut').textContent=s.spacing;[...$('colors').children].forEach(b=>b.classList.toggle('active',b.style.background===hexToRGB(s.color)))}
function hexToRGB(hex){let h=hex.slice(1);return `rgb(${parseInt(h.slice(0,2),16)}, ${parseInt(h.slice(2,4),16)}, ${parseInt(h.slice(4,6),16)})`}
for(const id of ['captionText','size','spacing','captionOn']){$(id).addEventListener('input',()=>{let s=state();s.caption=$('captionText').value;s.size=+$('size').value;s.spacing=+$('spacing').value;s.captionOn=$('captionOn').checked;$('sizeOut').textContent=s.size;$('spacingOut').textContent=s.spacing;persist();render()})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));for(const id of ['filter','adjust','caption'])$(id).classList.toggle('hidden',id!==b.dataset.tab)});
function draw(canvas,full=false){if(!img)return;let scale=full?1:Math.min(1,1100/img.width,1500/img.height);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);let c=canvas.getContext('2d',{willReadFrequently:true}),s=state(),w=canvas.width,h=canvas.height;c.drawImage(img,0,0,w,h);if(s.brightness||s.contrast||s.saturation||s.warm||s.fade){let im=c.getImageData(0,0,w,h),p=im.data,ct=(259*(255+s.contrast*1.3))/(255*(259-s.contrast*1.3)),sat=1+s.saturation/100;for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],gray=.2126*r+.7152*g+.0722*b;r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;r+=s.warm*.65;b-=s.warm*.55;g+=s.warm*.1;r=ct*(r-128)+128+s.brightness*1.2;g=ct*(g-128)+128+s.brightness*1.2;b=ct*(b-128)+128+s.brightness*1.2;let fade=s.fade/100;p[i]=r*(1-fade)+222*fade;p[i+1]=g*(1-fade)+210*fade;p[i+2]=b*(1-fade)+197*fade}c.putImageData(im,0,0)}if(s.captionOn&&s.caption.trim()){let lines=s.caption.split('\n'),fontSize=Math.max(12,w*s.size/100),lh=fontSize*s.spacing;c.font=`${fontSize}px Caveat, 'Nanum Pen Script', cursive`;c.textAlign='right';c.textBaseline='middle';c.fillStyle=s.color;c.shadowColor='rgba(40,28,20,.25)';c.shadowBlur=Math.max(1,w*.001);c.shadowOffsetY=Math.max(1,w*.0007);let x=s.x*w,y=s.y*h;lines.forEach((line,i)=>c.fillText(line,x,y+(i-(lines.length-1)/2)*lh,w*.8));c.shadowColor='transparent'}}
function render(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>draw($('preview')),35)}
let dragging=false;const pv=$('preview');function drag(e){let r=pv.getBoundingClientRect(),s=state();s.x=Math.max(.15,Math.min(.98,(e.clientX-r.left)/r.width));s.y=Math.max(.07,Math.min(.95,(e.clientY-r.top)/r.height));render()};pv.addEventListener('pointerdown',e=>{dragging=true;pv.setPointerCapture(e.pointerId);drag(e)});pv.addEventListener('pointermove',e=>{if(dragging)drag(e)});pv.addEventListener('pointerup',()=>{dragging=false;persist()});
$('export').onclick=async()=>{let b=$('export');b.disabled=true;b.textContent='고화질 생성 중…';try{await document.fonts.ready;let canvas=document.createElement('canvas');draw(canvas,true);let blob=await new Promise((ok,fail)=>canvas.toBlob(x=>x?ok(x):fail(Error('사진 생성 실패')),'image/jpeg',.98));outputFile=new File([blob],files[index].replace(/\.JPG$/i,'')+'-classic.jpg',{type:'image/jpeg'});if(outputURL)URL.revokeObjectURL(outputURL);outputURL=URL.createObjectURL(blob);$('resultImage').src=outputURL;$('result').classList.remove('hidden');canvas.width=canvas.height=1}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='완성본 저장'}};
$('closeResult').onclick=()=>$('result').classList.add('hidden');$('share').onclick=async()=>{if(!outputFile)return;if(navigator.share&&navigator.canShare?.({files:[outputFile]})){try{await navigator.share({files:[outputFile]});return}catch(e){if(e.name==='AbortError')return}}$('download').click()};$('download').onclick=()=>{let a=document.createElement('a');a.href=outputURL;a.download=outputFile.name;a.click()};
</script></body></html>
